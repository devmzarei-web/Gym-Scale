# ==============================================================================
# Nginx Configuration for Gym-Scale (NutriTrain)
# Copy to /etc/nginx/sites-available/gym-scale
# Symlink: sudo ln -s /etc/nginx/sites-available/gym-scale /etc/nginx/sites-enabled/
# Then test and reload: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

upstream gymscale_upstream {
    server 127.0.0.1:3020;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your actual domain

    # Increase maximum upload file size to 50MB (avatar uploads, gym assets, etc.)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Next.js static asset caching
    location /_next/static/ {
        proxy_pass http://gymscale_upstream;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploads caching
    location /uploads/ {
        proxy_pass http://gymscale_upstream;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Server-Sent Events (SSE) & Real-time chat streaming support
    location /api/messages/stream {
        proxy_pass http://gymscale_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Default reverse proxy for Next.js App
    location / {
        proxy_pass http://gymscale_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for heavy operations (e.g. AI generation, PDF rendering)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
